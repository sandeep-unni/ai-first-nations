version: "3.9"

services:
  db:
    image: postgres:16
    container_name: aifn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aifn
      POSTGRES_PASSWORD: aifn_dev_password
      POSTGRES_DB: aifn_mangrove
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifn -d aifn_mangrove"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
